<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PeriApicaI — Trợ lý AI Đào tạo X-quang Cận chóp</title>
    <meta name="description" content="Experimental AI-assisted research and education prototype for periapical radiograph technical-quality review and candidate pathology localisation." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="PeriApicaI — Trợ lý AI Đào tạo X-quang Cận chóp" />
    <meta property="og:description" content="Experimental AI-assisted research and education prototype for periapical radiograph technical-quality review and candidate pathology localisation." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('periapical_theme');
          var legacyDark = localStorage.getItem('periapical_dark_mode');
          var isDark = savedTheme === 'dark' || (savedTheme == null && legacyDark === 'true') || (savedTheme == null && legacyDark == null && window.matchMedia('(prefers-color-scheme: dark)').matches) || (savedTheme == null && legacyDark == null); // default dark
          
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
