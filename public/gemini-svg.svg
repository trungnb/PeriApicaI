<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Màu nền trung tâm -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4F8FE" />
      <stop offset="100%" stop-color="#E8F1FD" />
    </radialGradient>
  </defs>

  <!-- Cụm viền răng cưa hoa cúc (Rosette Badge) -->
  <polygon points="
    200.0,25.0 228.3,57.8 267.0,38.3 280.6,79.5
    323.7,76.3 320.6,119.4 361.7,133.0 342.2,171.7
    375.0,200.0 342.2,228.3 361.7,267.0 320.6,280.6
    323.7,323.7 280.6,320.6 267.0,361.7 228.3,342.2
    200.0,375.0 171.7,342.2 133.0,361.7 119.4,320.6
    76.3,323.7 79.5,280.6 38.3,267.0 57.8,228.3
    25.0,200.0 57.8,171.7 38.3,133.0 79.5,119.4
    76.3,76.3 119.4,79.5 133.0,38.3 171.7,57.8"
    fill="#D7E5FC"
    stroke="#D7E5FC"
    stroke-width="16"
    stroke-linejoin="round" />

  <!-- Vòng tròn nền ngoài -->
  <circle cx="200" cy="200" r="132" fill="#E2EDFD" />

  <!-- Viền chỉ may (Dotted/Dashed Stitching) -->
  <circle cx="200" cy="200" r="122"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="3"
          stroke-linecap="round"
          stroke-dasharray="4 6"
          opacity="0.9" />

  <!-- Vòng tròn tâm bên trong -->
  <circle cx="200" cy="200" r="115" fill="url(#innerGlow)" />

  <!-- Typography: Top 500 -->
  <g text-anchor="middle" font-family="'Google Sans', 'Roboto', 'Inter', -apple-system, sans-serif" font-weight="600" fill="#3B82F6">
    <text x="200" y="175" font-size="74" letter-spacing="1">Top</text>
    <text x="200" y="272" font-size="82" letter-spacing="-1">500</text>
  </g>
</svg>
